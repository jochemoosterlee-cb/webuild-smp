# One file per participant (REG-01). Triveria s. r. o. - the Madrid interop registration.
# EUID SKORSR.2022951382. The participant: ICD 0245 (Slovak DIČ, the scheme the Slovak
# Peppol Authority, Finančná správa SR, uses for Slovak organisations), value 2022951382 -
# the identifier the wallet's e-seal certificate carries (O, CN and SAN
# ebcore:iso6523:0245:2022951382; organizationIdentifier NTRSK-2022951382).
participant:
  scheme: urn:oasis:names:tc:ebcore:partyid-type:iso6523:0245   # lower case (ID-01)
  value: "2022951382"                                            # hyphen stripped (ID-01/ID-02)
  name: Triveria s. r. o. (TEST)                                 # informational, not published
  registrant: Triveria s. r. o.                                  # informational, not published
services:
  - service:
      scheme: bdx-docid-qns
      value: "urn:webuild:qerds:wmp-test:1.0"       # PLACEHOLDER: the agreed demo document type
    processMetadata:
      - process:
          value: "urn:webuild:proc:wmp-test:1.0"     # PLACEHOLDER
        endpoints:
          # The Triveria business wallet's WMP endpoint. The certificate is the wallet's
          # organisation e-seal (Ed25519), issued by the Cleverbase sandbox "Organisation
          # e-Seal CA" (TEST - not qualified), valid 2026-11-25 to 2027-11-25.
          - transportProfile: webuild-transport-wmp-v1
            address: https://kube.wallet.dev.triveria.io/api/v1/wmp/01a2085a-9939-7e7c-8a8d-8e3be1e29d5a
            description: Triveria business wallet WMP endpoint (TEST)
            contact: mailto:martin@triveria.io
            activationDate: "2026-11-25"
            expirationDate: "2027-11-25"             # the certificate's notAfter
            certificates:
              - certificate: ../certs/triveria-wallet-seal.pem
                typeCode: signing
  # No OID4VC services in the SMP record yet: whether the wallet's issuance
  # and presentation endpoints register as services follows the EBW EAA
  # decision (SPEC 8.2 placeholders).
